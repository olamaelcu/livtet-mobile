[settings]
env_shell_expand = true

# Bootstrap hooks: provision native toolchains on first install.
[hooks]
postinstall = "mise exec cargo:hk -- hk install --mise 2>/dev/null || true"

# Mobile-relevant tools. OS gates match the source mise.toml so cross-platform
# developers see the right subset on Linux (Android) vs macOS (iOS).
[tools]
# Cross-platform
"aqua:rust-lang/rustup" = "latest"
rust = "1.97.0"
"cargo:uniffi" = { version = "0.32.0", features = "cli" }
sqlite = "3.51.3"  # needed by core/livtet-core's build script (pkg-config lookup)
python = "3.12"  # used by _cargo_marker.py, ios-dev-init inline Python, scripts/check-swift-deps.sh
"aqua:koalaman/shellcheck" = "0.11.0"  # lint the mise task shell scripts
"aqua:mvdan/sh" = "3.12.0"  # shfmt — format the mise task shell scripts

# SOPS / secrets
"aqua:age" = "1.3.1"
"aqua:getsops/sops" = "3.13.2"
"aqua:jqlang/jq" = "1.8.2"

# Linux: Android toolchain
"cargo:cargo-ndk" = { version = "4.1.2", os = ["linux"] }
android-sdk = { version = "latest", os = ["linux"], postinstall = "mise run android-dev-init" }
gradle = { version = "8.14.5", os = ["linux"] }
kotlin = { version = "2.3.21", os = ["linux"] }
java = { version = "20", os = ["linux"] }
"aqua:ktlint" = { version = "1.8.0", os = ["linux"] }
"github:cli/cli" = { version = "latest", os = ["linux"] }

# macOS: iOS toolchain
ruby = { version = "3.3.6", os = ["macos"] }
swiftlint = { version = "0.58.0", os = ["macos"] }
xcodegen = { version = "2.42.0", os = ["macos"] }
cocoapods = { version = "1.16.2", os = ["macos"], postinstall = "mise run ios-dev-init" }
"github:kiliankoe/swift-outdated" = { version = "0.15.2", os = ["macos"] }
"github:peripheryapp/periphery" = { version = "3.7.4", os = ["macos"] }
xcbeautify = { version = "latest", os = ["macos"] }
"github:robotsandpencils/xcodes" = { version = "2.0.3", os = ["macos"] }
"github:indygreg/apple-platform-rs" = { version = "0.29.0", os = ["macos"] }

[env]
RUST_BACKTRACE = "full"
RUST_LOG = "tao=warn,wry=warn,tantivy=info,log=warn,trace"
PKG_CONFIG_PATH = { value = "{{ tools.sqlite.path }}/lib/pkgconfig:${PKG_CONFIG_PATH:-}", tools = true }
ANDROID_NDK_VERSION = "27.1.12297006"  # source of truth for the NDK; consumed by android-dev-init (sdkmanager install)

# ---- Inline union / watch tasks ----

[tasks.android-watch]
description = "Watch Kotlin files and auto-install on changes (hot reload loop)"
run = "mise watch android-install-incremental --on-busy-update=queue --exts kt,kts"

[tasks.android-run-emulator]
description = "Union task: boot emulator + build + install (one-command Android dev loop)"
run = [
  "mise run android-emulator --start phone",
  "mise run android-install-koreader",
  "mise run android-build --profile debug --flavor generic --target emulator",
  "mise run android-install --profile debug --flavor generic",
]

[tasks.ios-log-watch]
description = "Stream iOS logs from the booted simulator (filter by Livtet)"
run = "xcrun simctl spawn booted log stream --predicate 'subsystem == \"net.olamaelcu.livtet\"' --style compact"

# ---- Shell aliases (mirrors source mise.toml) ----

[shell_alias]
aw = "mise run android-watch"
aii = "mise run android-install-incremental"
apk = "mise run android-run-emulator"
isk = "mise run ios-run-simulator"
isk-ipad = "mise run ios-run-simulator --ipad"
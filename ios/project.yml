name: Livtet
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: net.olamaelcu.livtet
  disableCocoaPodsIntegration: true

packages:
  LivtetKit:
    path: ./LivtetKit
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    revision: "67310f115f3fc1e5e1f2e262f9009c64bb387e3f"  # 9.22.0

targets:
  Livtet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Livtet
    resources:
      - path: Livtet/Resources/Fonts
        type: folder
    dependencies:
      - package: LivtetKit
        product: LivtetKit
      - package: Sentry
        product: Sentry
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Livtet/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: net.olamaelcu.livtet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          OTHER_LDFLAGS: "$(inherited)"
          EMIT_FRONTEND_COMMAND_LINES: "YES"
          ENABLE_DEBUG_DYLIB: "NO"

  LivtetUnitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LivtetUnitTests
    dependencies:
      - target: Livtet
    settings:
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Livtet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Livtet"
      BUNDLE_LOADER: "$(TEST_HOST)"
      PRODUCT_BUNDLE_IDENTIFIER: net.olamaelcu.livtet.unittests
      GENERATE_INFOPLIST_FILE: YES
      FRAMEWORK_SEARCH_PATHS: "$(inherited) ${PODS_CONFIGURATION_BUILD_DIR}/LivtetKit.xcframework"
      SWIFT_VERSION: "5.0"

schemes:
  Livtet:
    build:
      targets:
        Livtet: all
        LivtetUnitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Livtet
      targets:
        - LivtetUnitTests
